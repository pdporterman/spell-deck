<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Spell Deck</title>
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="D&D 5e character creator and player tool: sheet, spells, class features, counters.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spell Deck">
  <script>try{var s=JSON.parse(localStorage.getItem('spelldeck.v2')||'null');if(s&&s.settings){document.documentElement.dataset.theme=s.settings.night?'dark':'light';document.documentElement.style.setProperty('--fs',String((s.settings.px||16)/16))}else{var z=parseFloat(localStorage.getItem('fs'));if(z>=.8&&z<=1.8)document.documentElement.style.setProperty('--fs',z);if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark'}}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">☰</button>
    <h1 id="title">Spell Deck</h1>
    <div id="edit-slot" class="edit-slot"></div>
  </header>
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>
  <main id="page"></main>
  <nav id="bottombar" class="bottombar" aria-label="Pages" hidden></nav>
  <noscript><p style="padding:1rem">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
